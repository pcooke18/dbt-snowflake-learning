sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres application database.
    tables:
      - name: customers
        description: Raw customer data.
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: orders
        description: Raw orders data.
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
              
        config:
          freshness:
            warn_after:
              count: 10
              period: day
            error_after:
              count: 30
              period: day
          loaded_at_field: _etl_loaded_at